<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Idle Ant Empire</title>

    <meta
        name="description"
        content="Baue dein Ameisenreich auf, sammle Ressourcen und erschaffe ein mächtiges Ameisenimperium in Idle Ant Empire."
    >

    <link rel="icon" type="image/png" href="images/header.png">
    <link rel="stylesheet" href="css/landing.css">

    <script src="js/landing.js" defer></script>
</head>

<body>
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="Idle Ant Empire – Startseite">
            <img
                src="images/header.png"
                alt=""
                class="brand-icon"
            >
            <span>Idle Ant Empire</span>
        </a>

        <nav class="header-actions" aria-label="Hauptnavigation">
            <div class="language-selector">
                <button
                    class="language-button"
                    id="language-button"
                    type="button"
                    aria-expanded="false"
                    aria-controls="language-menu"
                >
                    <span class="language-flag" aria-hidden="true">🇩🇪</span>
                    <span>Deutsch</span>
                    <span class="dropdown-arrow" aria-hidden="true">▾</span>
                </button>

                <div
                    class="language-menu"
                    id="language-menu"
                    aria-label="Sprache auswählen"
                    hidden
                >
                    <button
                        class="language-option active"
                        type="button"
                        data-lang="de"
                        aria-current="true"
                    >
                        <span class="language-flag" aria-hidden="true">🇩🇪</span>
                        <span>Deutsch</span>
                        <span class="language-status">Aktiv</span>
                    </button>

                    <button
                        class="language-option"
                        type="button"
                        data-lang="en"
                        disabled
                    >
                        <span class="language-flag" aria-hidden="true">🇬🇧</span>
                        <span>English</span>
                        <span class="language-status">Coming Soon</span>
                    </button>

                    <button
                        class="language-option"
                        type="button"
                        data-lang="fr"
                        disabled
                    >
                        <span class="language-flag" aria-hidden="true">🇫🇷</span>
                        <span>Français</span>
                        <span class="language-status">Bientôt</span>
                    </button>

                    <button
                        class="language-option"
                        type="button"
                        data-lang="es"
                        disabled
                    >
                        <span class="language-flag" aria-hidden="true">🇪🇸</span>
                        <span>Español</span>
                        <span class="language-status">Próximamente</span>
                    </button>
                </div>
            </div>

            <a class="header-play-button" href="game.html">
                Spielen
            </a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <img
                    src="images/header.png"
                    alt="Idle Ant Empire"
                    class="hero-icon"
                >

                <p class="eyebrow">Deine Kolonie. Dein Imperium.</p>

                <h1>
                    Idle Ant <span>Empire</span>
                </h1>

                <p class="hero-description">
                    Beginne mit einer kleinen Kolonie, sammle Ressourcen
                    und erschaffe ein mächtiges Ameisenimperium.
                </p>

                <a class="play-button" href="game.html">
                    <span>Kolonie aufbauen</span>
                    <span class="button-arrow" aria-hidden="true">→</span>
                </a>

                <p class="hero-note">
                    Dein Ameisenreich wartet auf dich.
                </p>
            </div>

            <div class="hero-divider" aria-hidden="true">
                <span></span>
                <span class="divider-symbol">✦</span>
                <span></span>
            </div>

            <div class="game-pillars" aria-label="Spielprinzip">
                <span>Aufbauen</span>
                <span class="pillar-dot" aria-hidden="true">·</span>
                <span>Verbessern</span>
                <span class="pillar-dot" aria-hidden="true">·</span>
                <span>Entdecken</span>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>© <span id="current-year">2026</span> Idle Ant Empire</p>
    </footer>
</body>
</html>
