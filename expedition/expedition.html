<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expeditionen — Idle Ant Empire alpha-v0.00.006c</title>
</head>
<body>
    <section class="game-view expedition-page-view is-active" id="game-view-expeditions" data-game-view-panel="expeditions" aria-label="Expeditionen" data-i18n-aria-label="nav.expeditions">
                <div class="view-intro">
                    <p class="view-eyebrow" data-i18n="expedition.eyebrow">ERKUNDUNG & BEUTE</p>
                    <h2 data-i18n="nav.expeditions">Expeditionen</h2>
                    <p data-i18n="expedition.intro">Schicke deine Ameisen hinaus, sammle Ressourcen und entdecke neue Möglichkeiten für deine Kolonie.</p>
                </div>
                <div class="expedition-action-card">
                    <div class="expedition-action-copy"><span class="expedition-card-icon" aria-hidden="true">🧭</span><div><h3 data-i18n="expedition.cardTitle">Neue Expedition starten</h3><p data-i18n="expedition.cardText">Deine Ameisen erkunden die Umgebung und bringen mit etwas Glück wertvolle Funde zurück.</p></div></div>
                    <button id="expedition-btn" class="btn-progress">
                    <div id="expedition-progress" class="progress-fill"></div>
                    <span id="expedition-text" class="btn-text">
                        Auf Expedition gehen (10s)
                    </span>
                </button>
                </div>
            </section>
    <script>
    (() => {
        const root = document.querySelector('[data-game-view-panel="expeditions"]');
        if (!root) {
            parent.postMessage({ type: 'iae-section-error', name: 'expeditions', message: 'Der Ansichtsbereich fehlt.' }, '*');
            return;
        }
        parent.postMessage({ type: 'iae-section-ready', name: 'expeditions', html: root.outerHTML }, '*');
    })();
    </script>
</body>
</html>
