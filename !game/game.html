
<!DOCTYPE html>
<html lang="de">
<head>
        <base href="../">
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="!!maintenance/maintenance.js?v=20261028b"></script>
    <title>Idle Ant Empire — alpha-v0.00.006c</title>

    <link rel="stylesheet" href="!game/css/core/loading-screen.css">
    <link rel="icon" type="image/png" href="!game/assets/images/header.png">

    <script src="!game/js/stylesLoader.js"></script>

    <!-- Mehrsprachigkeit: klassische Skripte für file:// -->
    <script src="!game/js/i18n/i18n.js"></script>
    <script src="!game/js/i18n/de.js"></script>
    <script src="!game/js/i18n/en.js"></script>
    <script src="!game/js/i18n/es.js"></script>
    <script src="!game/js/i18n/fr.js"></script>
    <script src="!game/js/i18n/it.js"></script>
    <script src="!game/js/i18n/tr.js"></script>

    <!-- Musik wird vor dem Modul-Loader geladen. -->
    <script src="!game/js/musicController.js"></script>
    <script src="!game/js/gameSections.js"></script>
    <script src="!game/js/main.js"></script>
</head>

<body data-initial-view="expeditions">

    <!-- =========================
         Loading Screen
    ========================= -->
    <div id="loading-screen" role="status" aria-live="polite">
        <div class="loading-content">
            <img src="!game/assets/images/header.png" alt="" class="loading-icon">

            <h1 class="loading-title">
                Idle Ant <span>Empire</span>
            </h1>

            <p class="loading-subtitle" data-i18n="loading.subtitle">
                Deine Kolonie wird vorbereitet ...
            </p>

            <div
                class="loading-bar"
                role="progressbar"
                data-i18n-aria-label="loading.progressLabel"
                aria-label="Spiel wird geladen"
                aria-valuemin="0"
                aria-valuemax="100"
            >
                <div class="loading-bar-fill"></div>
            </div>

            <p id="loading-status" class="loading-status" data-i18n="loading.initial">
                Ameisen werden versammelt ...
            </p>
        </div>
    </div>

    <!-- =========================
         Game Screen
    ========================= -->
    <div id="flash-overlay"></div>
    <div id="achievement-trophy-overlay">🏆</div>

    <div id="game-container">

        <header class="sticky-top">
            <div class="header-top">
                <div class="header-brand">
                    <img src="!game/assets/images/header.png" class="header-main-icon" alt="">
                    <h1 class="fancy-title brand-gold main-title-large">
                        Idle Ant Empire
                        <span class="version-tag"></span>
                    </h1>
                </div>
            </div>

            <div class="resource-bar">
                <div class="res-item">
                    <span class="res-label" data-i18n="resource.food">Nahrung</span>
                    <div class="res-value-container">
                        <span id="food-count" class="res-value resource-gold">0.00</span>
                        <span id="food-max" class="res-max">/ 0</span>
                    </div>
                    <div id="food-rate" class="res-rate rate-neutral">0.00/s</div>
                </div>

                <div class="res-item">
                    <span class="res-label" data-i18n="resource.larvae">Larven</span>
                    <div class="res-value-container">
                        <span id="larvae-count" class="res-value resource-gold">0.00</span>
                        <span id="larvae-max" class="res-max">/ 0</span>
                    </div>
                    <div id="larvae-rate" class="res-rate rate-neutral">0.00/s</div>
                </div>
            </div>
            <div class="header-status-line" role="status" aria-live="polite">
                <span class="status-label" data-i18n="status.label">Status:</span>
                <span id="status-text" data-i18n="status.init">Initialisierung...</span>
            </div>
        </header>

        <div class="game-shell">
            <nav class="game-navigation" aria-label="Spielbereiche" data-i18n-aria-label="nav.aria">
                <button class="game-nav-button is-active" type="button" data-game-view="expeditions" aria-controls="game-view-expeditions" aria-current="page">
                    <span class="game-nav-icon" aria-hidden="true">🧭</span><span data-i18n="nav.expeditions">Expeditionen</span>
                </button>
                <div class="game-nav-divider"></div>
                <button class="game-nav-button" type="button" data-game-view="units" aria-controls="game-view-units">
                    <span class="game-nav-icon" aria-hidden="true">♟</span><span data-i18n="nav.units">Einheiten</span>
                </button>
                <button class="game-nav-button" type="button" data-game-view="structures" aria-controls="game-view-structures">
                    <span class="game-nav-icon" aria-hidden="true">⌂</span><span data-i18n="nav.structures">Gebäude</span>
                </button>
                <button class="game-nav-button" id="game-nav-research" type="button" data-game-view="research" aria-controls="game-view-research" hidden>
                    <span class="game-nav-icon" aria-hidden="true">⚗</span><span data-i18n="nav.research">Forschung</span>
                </button>
                <button class="game-nav-button" id="game-nav-military" type="button" data-game-view="military" aria-controls="game-view-military" hidden>
                    <span class="game-nav-icon" aria-hidden="true">⚔</span><span data-i18n="nav.military">Militär</span>
                </button>
                <div class="game-nav-divider"></div>
                <button class="game-nav-button" type="button" data-game-view="logbook" aria-controls="game-view-logbook">
                    <span class="game-nav-icon" aria-hidden="true">📖</span><span data-i18n="nav.logbook">Logbuch</span>
                </button>
                <button class="game-nav-button" id="game-nav-achievements" type="button" data-game-view="achievements" aria-controls="game-view-achievements" hidden>
                    <span class="game-nav-icon" aria-hidden="true">🏆</span><span data-i18n="nav.achievements">Erfolge</span>
                </button>
                <button class="game-nav-button" id="game-nav-statistics" type="button" data-game-view="statistics" aria-controls="game-view-statistics">
                    <span class="game-nav-icon" aria-hidden="true">📊</span><span data-i18n="nav.statistics">Statistik</span>
                </button>
                <button class="game-nav-button" id="game-nav-options" type="button" data-game-view="options" aria-controls="game-view-options">
                    <span class="game-nav-icon" aria-hidden="true">⚙</span><span data-i18n="nav.options">Optionen</span>
                </button>
            </nav>

            <main class="game-main" id="game-main" aria-live="off"></main>
        </div> <!-- /.game-shell -->

        <!-- =========================
             Footer
        ========================= -->
        <!-- Footer entfernt: Status steht im Header, Bereiche liegen in der Seitennavigation. -->

        <!-- =========================
             Forschungszentrum-Panel
             Öffnet sich über die Glühlampe im Footer.
        ========================= -->
        

    </div>
</body>
</html>
